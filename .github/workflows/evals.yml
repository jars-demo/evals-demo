# The harness tests, lint, and the offline eval as a gate (chapter 07).
name: Evals

on:
  push:
    branches: [main]
    paths: ['evals/**', '.github/workflows/evals.yml']
  pull_request:
    paths: ['evals/**', '.github/workflows/evals.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pipx install uv==0.11.3
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Eval (offline baseline)
        run: uv run python -m triage run --min-score 0.6 --save runs/ci.json
